<!DOCTYPE html>
<html lang="fr" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Notepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 flex h-full items-center py-16">
    <main class="w-full max-w-md mx-auto px-4">
        <!-- Logo centré -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex flex-col items-center gap-3">
                <div
                    class="w-12 h-12 bg-blue-700 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-700/20">
                    <svg class="w-6 h-6 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z" />
                        <path d="M15 3v6h6" />
                        <path d="M8 13h8" />
                        <path d="M8 17h4" />
                    </svg>
                </div>
                <span class="text-2xl font-bold text-slate-800">Note<span class="text-blue-700">pad</span></span>
            </a>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="px-7 pt-7 text-center">
                <h1 class="text-xl font-bold text-slate-800">Créer un compte</h1>
                <p class="mt-1.5 text-sm text-slate-500">
                    Déjà inscrit ?
                    <a href="login.html" class="text-blue-700 font-semibold hover:underline">Se connecter</a>
                </p>
            </div>

            <div class="px-7 py-7 space-y-4">
                <!-- Nom -->
                <div class="space-y-1.5">
                    <label for="name" class="block text-xs font-semibold uppercase tracking-widest text-slate-500">Nom
                        complet</label>
                    <input type="text" id="name"
                        class="py-3 px-4 block w-full bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder:text-slate-400 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 transition-all outline-none"
                        placeholder="Jean Dupont" required>
                </div>

                <!-- Email -->
                <div class="space-y-1.5">
                    <label for="email"
                        class="block text-xs font-semibold uppercase tracking-widest text-slate-500">Adresse
                        email</label>
                    <input type="email" id="email"
                        class="py-3 px-4 block w-full bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder:text-slate-400 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 transition-all outline-none"
                        placeholder="vous@exemple.com" required>
                </div>

                <!-- Mot de passe -->
                <div class="space-y-1.5">
                    <label for="password"
                        class="block text-xs font-semibold uppercase tracking-widest text-slate-500">Mot de
                        passe</label>
                    <input type="password" id="password"
                        class="py-3 px-4 block w-full bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder:text-slate-400 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 transition-all outline-none"
                        placeholder="Min. 8 caractères" required>
                </div>

                <!-- Confirmer mot de passe -->
                <div class="space-y-1.5">
                    <label for="password_confirmation"
                        class="block text-xs font-semibold uppercase tracking-widest text-slate-500">Confirmer le mot de
                        passe</label>
                    <input type="password" id="password_confirmation"
                        class="py-3 px-4 block w-full bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder:text-slate-400 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 transition-all outline-none"
                        placeholder="••••••••" required>
                </div>

                <button type="submit"
                    class="w-full py-3 px-4 inline-flex justify-center items-center gap-2 text-sm font-semibold rounded-xl bg-blue-700 text-white hover:bg-blue-800 active:scale-[0.99] transition-all shadow-md shadow-blue-700/20 mt-2">
                    Créer mon compte
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>
    </main>
</body>

</html>
