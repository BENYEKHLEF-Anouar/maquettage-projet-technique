<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="p-8 bg-white flex items-center gap-8">
    <!-- Lien inactif -->
    <a href="#"
        class="relative text-sm font-medium text-slate-500 hover:text-blue-700 transition-colors duration-200 group">
        Notes
        <span
            class="absolute -bottom-0.5 left-0 w-0 h-0.5 bg-blue-700 rounded-full transition-all duration-300 group-hover:w-full"></span>
    </a>
    <!-- Lien actif -->
    <a href="#" class="relative text-sm font-semibold text-blue-700">
        Accueil
        <span class="absolute -bottom-0.5 left-0 w-full h-0.5 bg-blue-700 rounded-full"></span>
    </a>
    <!-- Lien inactif -->
    <a href="#"
        class="relative text-sm font-medium text-slate-500 hover:text-blue-700 transition-colors duration-200 group">
        Aide
        <span
            class="absolute -bottom-0.5 left-0 w-0 h-0.5 bg-blue-700 rounded-full transition-all duration-300 group-hover:w-full"></span>
    </a>

</html>
