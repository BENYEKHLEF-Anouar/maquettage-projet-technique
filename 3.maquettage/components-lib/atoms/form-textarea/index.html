<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="p-8 bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-sm space-y-1.5">
        <label for="textarea-label" class="block text-xs font-semibold uppercase tracking-widest text-slate-500">Contenu
            de la note</label>
        <textarea id="textarea-label"
            class="py-3.5 px-4 block w-full bg-white border border-slate-200 rounded-xl text-sm text-slate-700 placeholder:text-slate-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 transition-all outline-none shadow-sm resize-none"
            rows="4" placeholder="Rédigez votre note ici..."></textarea>
        <p class="text-xs text-slate-400 text-right">0 / 500 caractères</p>
    </div>
</body>

</html>
