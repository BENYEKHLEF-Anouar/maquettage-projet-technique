<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        input[type="checkbox"] {
            accent-color: #0449AE;
        }
    </style>
</head>

<body class="p-8 bg-slate-50 flex items-start justify-center min-h-screen flex-col gap-3 max-w-xs mx-auto">
    <!-- Checkbox standard -->
    <label class="flex items-center gap-3 cursor-pointer group">
        <input type="checkbox"
            class="w-4 h-4 rounded border-slate-300 focus:ring-2 focus:ring-blue-600/20 transition-all" id="checkbox-1">
        <span class="text-sm text-slate-600 group-hover:text-slate-800 transition-colors font-medium">Note
            publique</span>
    </label>
    <!-- Checkbox cochée -->
    <label class="flex items-center gap-3 cursor-pointer group">
        <input type="checkbox" checked
            class="w-4 h-4 rounded border-slate-300 focus:ring-2 focus:ring-blue-600/20 transition-all" id="checkbox-2">
        <span class="text-sm text-slate-600 group-hover:text-slate-800 transition-colors font-medium">Recevoir les
            notifications</span>
    </label>
    <!-- Checkbox désactivé -->
    <label class="flex items-center gap-3 cursor-not-allowed opacity-50">
        <input type="checkbox" disabled class="w-4 h-4 rounded border-slate-300" id="checkbox-3">
        <span class="text-sm text-slate-500 font-medium">Option désactivée</span>
    </label>
</body>

</html>
