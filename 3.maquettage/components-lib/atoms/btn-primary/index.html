<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="p-8 bg-slate-50 flex flex-col items-center justify-center gap-4 min-h-screen">
    <!-- Primary -->
    <button type="button"
        class="py-3 px-6 inline-flex justify-center items-center gap-2.5 rounded-xl font-semibold bg-blue-700 text-white hover:bg-blue-800 shadow-md shadow-blue-700/20 hover:shadow-blue-700/30 active:scale-[0.98] transition-all text-sm group">
        <span>Accéder aux notes</span>
        <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
        </svg>
    </button>
    <!-- Ghost -->
    <button type="button"
        class="py-3 px-6 inline-flex justify-center items-center gap-2.5 rounded-xl font-semibold bg-white border border-slate-200 text-slate-700 hover:border-slate-300 hover:bg-slate-50 active:scale-[0.98] transition-all text-sm">
        Annuler
    </button>
</body>

</html>
