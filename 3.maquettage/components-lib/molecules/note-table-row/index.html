<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-white p-8">
    <div class="rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
        <table class="min-w-full divide-y divide-slate-100">
            <thead>
                <tr class="bg-slate-50">
                    <th scope="col"
                        class="px-5 py-3 text-start text-[11px] font-semibold text-slate-500 uppercase tracking-widest">
                        Titre</th>
                    <th scope="col"
                        class="px-5 py-3 text-start text-[11px] font-semibold text-slate-500 uppercase tracking-widest">
                        Catégorie</th>
                    <th scope="col"
                        class="px-5 py-3 text-start text-[11px] font-semibold text-slate-500 uppercase tracking-widest">
                        Visibilité</th>
                    <th scope="col"
                        class="px-5 py-3 text-start text-[11px] font-semibold text-slate-500 uppercase tracking-widest">
                        Date</th>
                    <th scope="col"
                        class="px-5 py-3 text-end text-[11px] font-semibold text-slate-500 uppercase tracking-widest">
                        Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 bg-white">
                <tr class="hover:bg-slate-50/70 transition-colors group">
                    <td class="px-5 py-4 whitespace-nowrap">
                        <span
                            class="text-sm font-medium text-slate-800 group-hover:text-blue-700 transition-colors">Optimiser
                            son workflow Laravel</span>
                    </td>
                    <td class="px-5 py-4 whitespace-nowrap">
                        <span
                            class="inline-flex items-center gap-1.5 py-0.5 px-2.5 rounded-full text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-100">Travail</span>
                    </td>
                    <td class="px-5 py-4 whitespace-nowrap">
                        <span
                            class="inline-flex items-center gap-1.5 py-0.5 px-2.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-100">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                            Public
                        </span>
                    </td>
                    <td class="px-5 py-4 whitespace-nowrap text-sm text-slate-500">23 fév. 2026</td>
                    <td class="px-5 py-4 whitespace-nowrap">
                        <div class="flex items-center justify-end gap-1.5">
                            <button title="Modifier"
                                class="inline-flex items-center justify-center w-7 h-7 rounded-lg text-blue-600 bg-blue-50 hover:bg-blue-100 border border-blue-100 transition-all active:scale-95">
                                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                                </svg>
                            </button>
                            <button title="Supprimer"
                                class="inline-flex items-center justify-center w-7 h-7 rounded-lg text-red-500 bg-red-50 hover:bg-red-100 border border-red-100 transition-all active:scale-95">
                                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M3 6h18" />
                                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr class="hover:bg-slate-50/70 transition-colors group">
                    <td class="px-5 py-4 whitespace-nowrap">
                        <span class="text-sm font-medium text-slate-800 group-hover:text-blue-700 transition-colors">Mes
                            objectifs 2026</span>
                    </td>
                    <td class="px-5 py-4 whitespace-nowrap">
                        <span
                            class="inline-flex items-center gap-1.5 py-0.5 px-2.5 rounded-full text-[11px] font-semibold bg-violet-50 text-violet-700 border border-violet-100">Personnel</span>
                    </td>
                    <td class="px-5 py-4 whitespace-nowrap">
                        <span
                            class="inline-flex items-center gap-1.5 py-0.5 px-2.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-600 border border-slate-200">
                            <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                            Privé
                        </span>
                    </td>
                    <td class="px-5 py-4 whitespace-nowrap text-sm text-slate-500">20 fév. 2026</td>
                    <td class="px-5 py-4 whitespace-nowrap">
                        <div class="flex items-center justify-end gap-1.5">
                            <button title="Modifier"
                                class="inline-flex items-center justify-center w-7 h-7 rounded-lg text-blue-600 bg-blue-50 hover:bg-blue-100 border border-blue-100 transition-all active:scale-95">
                                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                                </svg>
                            </button>
                            <button title="Supprimer"
                                class="inline-flex items-center justify-center w-7 h-7 rounded-lg text-red-500 bg-red-50 hover:bg-red-100 border border-red-100 transition-all active:scale-95">
                                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M3 6h18" />
                                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
