<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 p-8">
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-200">
        <!-- Titre & sous-titre -->
        <div>
            <p class="text-xs font-semibold uppercase tracking-widest text-blue-700 mb-1">Tableau de bord</p>
            <h1 class="text-2xl font-bold text-slate-800 leading-tight">Mes Notes</h1>
            <p class="text-sm text-slate-500 mt-0.5 font-normal">Gérez et organisez vos écrits personnels.</p>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2.5">
            <!-- Bouton secondaire (exporter) -->
            <button type="button"
                class="inline-flex items-center gap-2 py-2.5 px-4 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 hover:border-slate-300 transition-all active:scale-[0.98]">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Exporter
            </button>
            <!-- Bouton principal -->
            <button type="button"
                class="inline-flex items-center gap-2 py-2.5 px-5 text-sm font-semibold text-white bg-blue-700 rounded-xl hover:bg-blue-800 transition-all active:scale-[0.98] shadow-md shadow-blue-700/20">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Nouvelle Note
            </button>
        </div>
    </header>
</body>

</html>
