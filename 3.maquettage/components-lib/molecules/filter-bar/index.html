<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        select {
            appearance: none;
        }
    </style>
</head>

<body class="bg-slate-50 p-8">
    <div
        class="max-w-[85rem] mx-auto bg-white rounded-2xl border border-slate-200/70 shadow-sm p-4 flex flex-col md:flex-row gap-4 items-end">

        <!-- Search Input -->
        <div class="flex-1 w-full space-y-1.5">
            <label class="block text-xs font-semibold uppercase tracking-widest text-slate-500">Rechercher</label>
            <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
                    <svg class="w-4 h-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                </div>
                <input type="text"
                    class="pl-10 pr-4 py-3 block w-full bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder:text-slate-400 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 transition-all outline-none"
                    placeholder="Rechercher par mot-clé...">
            </div>
        </div>

        <!-- Category Select -->
        <div class="w-full md:w-56 space-y-1.5">
            <label class="block text-xs font-semibold uppercase tracking-widest text-slate-500">Catégorie</label>
            <div class="relative">
                <select
                    class="appearance-none py-3 px-4 pr-10 block w-full bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 outline-none transition-all">
                    <option selected>Toutes les catégories</option>
                    <option>Travail</option>
                    <option>Études</option>
                    <option>Personnel</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                    <svg class="w-4 h-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
