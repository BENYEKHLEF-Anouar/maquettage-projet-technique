<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 p-12 flex justify-center items-center min-h-screen">
    <div class="max-w-sm w-full">
        <!-- Note Card (Template Blade conforme) -->
        <a class="group flex flex-col h-full bg-white border border-gray-200 shadow-sm rounded-xl hover:shadow-md transition"
            href="#">
            <!-- Image Section -->
            <div class="h-52 flex flex-col justify-center items-center bg-gray-100 rounded-t-xl overflow-hidden">
                <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-in-out"
                    src="https://images.unsplash.com/photo-1517842645767-c639042777db?q=80&w=2070&auto=format&fit=crop"
                    alt="Note Image">
            </div>

            <!-- Content Section -->
            <div class="p-4 md:p-6 text-start">
                <div class="flex flex-wrap gap-2 mb-3">
                    <span
                        class="inline-flex items-center gap-1.5 py-1 px-2 rounded-md text-xs font-medium bg-blue-100 text-blue-800">
                        Travail
                    </span>
                    <span
                        class="inline-flex items-center gap-1.5 py-1 px-2 rounded-md text-xs font-medium bg-blue-100 text-blue-800">
                        Laravel
                    </span>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 line-clamp-2 break-words">
                    Optimiser son workflow Laravel
                </h3>
                <p class="text-sm text-gray-500 mb-1 mt-3">Aperçu</p>
                <p class="text-gray-500 line-clamp-3 break-words text-sm">
                    Découvrez les meilleures pratiques pour gagner du temps lors du développement de vos applications
                    PHP avec le framework Laravel. De PHPStorm aux migrations...
                </p>
            </div>

            <!-- Footer Section -->
            <div class="mt-auto border-t border-gray-200 p-4 md:p-6 flex items-center justify-between">
                <div class="flex items-center gap-x-3">
                    <div class="flex items-center gap-x-1.5 text-xs text-gray-500">
                        <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        <span>23/02/2026</span>
                    </div>
                    <div class="flex items-center gap-x-1.5 text-xs text-gray-500">
                        <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <span>Anouar B.</span>
                    </div>
                </div>
                <div class="justify-end text-blue-600 hover:text-blue-800 font-medium text-sm flex items-center gap-1">
                    Lire plus <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </div>
            </div>
        </a>
    </div>
</body>

</html>
