<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../../charte-graphique/tailwind.config.js"></script>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
</head>

<body class="bg-slate-50 min-h-screen">
    <nav
        class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/60 transition-all duration-300">
        <div class="max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- A1: Logo Premium -->
                <a href="#" class="group flex items-center gap-3 transition-transform duration-200 active:scale-95">
                    <div class="relative flex items-center justify-center">
                        <div
                            class="absolute inset-0 bg-blue-600 rounded-xl blur-[10px] opacity-10 group-hover:opacity-30 transition-opacity">
                        </div>
                        <div
                            class="relative w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-700 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/10 border border-white/20">
                            <svg class="w-5 h-5 text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z" />
                                <path d="M15 3v6h6" />
                                <path d="M8 13h8" />
                            </svg>
                        </div>
                    </div>
                    <span class="text-xl font-black tracking-tighter text-slate-800">
                        Note<span
                            class="bg-gradient-to-r from-blue-500 to-blue-700 bg-clip-text text-transparent">pad</span>
                    </span>
                </a>

                <!-- Navigation Links -->
                <div class="hidden md:flex items-center gap-8">
                    <div class="flex items-center gap-6">
                        <a href="#"
                            class="text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-blue-600 transition-colors relative group">
                            Notes
                            <span
                                class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
                        </a>
                        <a href="#"
                            class="text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-blue-600 transition-colors relative group">
                            Aide
                            <span
                                class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
                        </a>
                    </div>

                    <div class="h-6 w-px bg-slate-200 mx-2"></div>

                    <div class="flex items-center gap-4">
                        <a href="#"
                            class="text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-slate-800 transition-colors">Connexion</a>
                        <button type="button"
                            class="py-2.5 px-5 inline-flex justify-center items-center gap-2 rounded-xl border border-blue-600/20 font-bold bg-gradient-to-r from-blue-500 to-blue-700 text-white shadow-lg shadow-blue-500/10 hover:shadow-blue-500/20 hover:-translate-y-0.5 transition-all text-[11px] uppercase tracking-wider">
                            Inscription
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</body>

</html>
